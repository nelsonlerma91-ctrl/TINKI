<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tinki Industry Jeans – Inventario</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050505;--card:#121110;--tx:#f4ecd6;--mut:#a99e83;--bd:#3b3322;--ac:#d4af37;--act:#14110a;--ok:#6ee7a0;--bad:#f87171;--wa:#f0b84a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0;color:var(--ac)}
.brand{text-align:center;margin:0 0 8px}.brand img{max-width:92%;object-fit:contain;display:inline-block}
button.p{font-weight:600}h2{font-size:16px;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac)}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
button.d{color:var(--bad)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
input[type=number]{width:84px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}
.big{font-size:26px;font-weight:700}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90%}
a.lk{color:var(--ac);cursor:pointer;text-decoration:underline}
#app.adm{max-width:1240px;display:grid;grid-template-columns:230px 1fr;gap:0 16px;align-items:start}
#app.adm>*{grid-column:2}
#app.adm>.side{grid-column:1;grid-row:1/60;position:sticky;top:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
.side details{margin:2px 0}.side summary{cursor:pointer;padding:8px 10px;font-weight:600;color:var(--ac);list-style:none}
.side summary::before{content:"\25B8  "}.side details[open] summary::before{content:"\25BE  "}
.side button{display:block;width:100%;text-align:left;margin:2px 0;border-color:transparent;background:transparent}
.side button.on{background:var(--ac);color:var(--act);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mut)}.kpi.neg{border-left-color:var(--bad)}.kpi.neg b{color:var(--bad)}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar{height:8px;background:var(--ac);border-radius:4px}
@media(max-width:820px){#app.adm{display:block}#app.adm>.side{position:static;margin-bottom:12px}}
</style>
</head>

const logo=h=>'<img src="'+LOGO+'" alt="Tinki Industry Jeans" style="height:'+(h||64)+'px">';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const INI='2026-11-01',FIN='2026-12-31';
const MODO_PRUEBAS=false;
const S={admin:false,db:null,costos:{},prods:[],puestos:{},regs:{},fecha:(hoy()<INI?INI:hoy()>FIN?FIN:hoy()),sel:null,tab:'inicio',me:null,pin:'',ready:false};
let pend=false,tm;
function msg(t){const m=$('#msg');m.textContent=t;m.hidden=false;clearTimeout(tm);tm=setTimeout(()=>m.hidden=true,4000)}
function render(force){const a=document.activeElement;
  if(!force&&a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)&&$('#app').contains(a)){pend=true;return}
  pend=false;draw()}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;
  if(pend&&!(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)))render()},60));

function subRegs(){if(S.unsub)S.unsub();
  S.unsub=S.db.collection('registros').where('fecha','==',S.fecha).onSnapshot(q=>{S.regs={};q.docs.forEach(d=>S.regs[d.id]=d.data());render()},e=>msg('Error: '+e.message))}

(async()=>{
  try{S.db=remoteDB();S.local=false}catch(e){}
  try{S.ses=JSON.parse(localStorage.getItem('inv_ses')||'null')}catch(e){S.ses=null}
  if(S.ses&&S.ses.u&&S.ses.h){
    try{aplicarSrv(await srv({accion:'sync'}))}
    catch(e){S.ses=null;try{localStorage.removeItem('inv_ses')}catch(x){};msg(e.message)}
  }
  S.ready=true;render(true);
})();
function aplicarSrv(d){
  if(d.rol!=='admin')throw new Error('Esta entrada es solo para el administrador. Use la entrada de responsables.');
  S.admin=true;S.isAdm=true;S.acc={u:USUARIO_ADMIN,otros:[]};
  iniciarSubs();
}
let _subsOk=false;
function iniciarSubs(){
  if(_subsOk)return;_subsOk=true;
  S.db.doc('config/main').onSnapshot(s=>{S.prods=(s.data()||{}).prods||[];render()});
  S.db.collection('registros').onSnapshot(q=>{S.all=q.docs.map(d=>d.data());render()},()=>{});
  S.db.collection('gastos').onSnapshot(q=>{S.gas=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  S.db.collection('cierres').onSnapshot(q=>{S.cierres={};q.docs.forEach(d=>S.cierres[d.id]=d.data());render()},()=>{});
  S.db.doc('respaldo/ultimo').onSnapshot(s=>{S.resp=s.exists?s.data():null;render()},()=>{});
  S.db.doc('acceso/admin').onSnapshot(s=>{S.acc=s.exists?s.data():null;S.accOk=true;render()},()=>{S.accOk=true;render()});
  S.db.doc('costos/main').onSnapshot(s=>{S.costos=(s.data()||{}).c||{};render()},()=>{});
  S.db.collection('puestos').onSnapshot(q=>{S.puestos={};q.docs.forEach(d=>S.puestos[d.id]=d.data());render()});
  subRegs();
}


function getRec(pid){const k=pid+'_'+S.fecha;if(S.regs[k])return JSON.parse(JSON.stringify(S.regs[k]));
  return{pid,fecha:S.fecha,inicial:Object.assign({},S.puestos[pid].stock||{}),entregas:[],final:{},cerrado:false,liquidado:false}}
const saveRec=r=>{if((S.cierres||{})[r.fecha.slice(0,7)])throw new Error('El mes '+r.fecha.slice(0,7)+' est\u00e1 cerrado');return S.db.doc('registros/'+r.pid+'_'+r.fecha).set(r)};
const log=a=>S.db.collection('bitacora').add({t:Date.now(),fecha:S.fecha,quien:S.isAdm?'Administrador':((S.puestos[S.me]||{}).nombre||'?'),acc:a}).catch(()=>{});
function quitarEnt(r,p,c){const tot=entOf(r,p);if(c>tot)return'Hoy solo hay '+tot+' unidades entregadas de ese producto';
  let f=c;for(let i=r.entregas.length-1;i>=0&&f>0;i--){const y=r.entregas[i];if(y.p!==p)continue;if(y.c<=f){f-=y.c;r.entregas.splice(i,1)}else{y.c-=f;f=0}}
  const d=(r.inicial[p]||0)+entOf(r,p);if(r.parcial&&r.parcial[p]!=null&&+r.parcial[p]>d)return'Ese producto ya tiene '+r.parcial[p]+' vendidas reportadas; no puede quedar con menos disponible que eso';return''}
const nomProd=id=>(S.prods.find(z=>z.id===id)||{}).nombre||'?';
const entOf=(r,id)=>(r.entregas||[]).filter(y=>y.p===id).reduce((a,y)=>a+y.c,0);
function totales(pid){const r=getRec(pid);let u=0,v=0,g=0,disp=0,q=0,A={};
  S.prods.forEach(x=>{const i=r.inicial[x.id]||0,e=entOf(r,x.id);disp+=i+e;
    const sv=(r.cerrado&&r.final&&r.final[x.id]!=null)?i+e-r.final[x.id]:(r.parcial&&r.parcial[x.id]!=null?+r.parcial[x.id]:null);A[x.id]={d:i+e,s:sv||0};q+=i+e-(sv||0);if(sv!=null){const s=sv,pr=(r.precios&&r.precios[x.id]!=null)?r.precios[x.id]:x.precio;u+=s;v+=s*pr;g+=s*(pr-(S.costos[x.id]||0))}});
  return{r,u,v,g,disp,q,A}}

function dia(pid,adm){
  const p=S.puestos[pid];if(!p)return'<p class="mut">Puesto no encontrado.</p>';
  if(!S.prods.length)return'<p class="mut">Aún no hay productos. El administrador debe crearlos.</p>';
  const r=getRec(pid),cl=r.cerrado;let tot=0,tu=0,gt=0;
  const rows=S.prods.map(x=>{const i=r.inicial[x.id]||0,e=entOf(r,x.id);
    const f=cl?(r.final||{})[x.id]:null,pr=cl&&r.precios&&r.precios[x.id]!=null?r.precios[x.id]:x.precio;
    const v=cl&&f!=null?i+e-f:null;if(v!=null){tot+=v*pr;tu+=v;gt+=v*(pr-(S.costos[x.id]||0))}

async function srv(body){
  let url=API_URL_FIJA;try{url=localStorage.getItem('tinki_url')||API_URL_FIJA}catch(e){}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);

    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(Object.assign({u:S.ses&&S.ses.u,h:S.ses&&S.ses.h},body)),signal:ctl.signal});
    j=await r.json();
  }catch(e){throw new Error(e.name==='AbortError'?'El servidor tardó demasiado. Intente de nuevo.':'No hay conexión con el servidor.')}
  finally{clearTimeout(t)}
  if(j.error){

const snapD=(p,d)=>({id:p.split('/').pop(),exists:d!=null,data:()=>d==null?undefined:JSON.parse(JSON.stringify(d))});

async function deleteDoc(p){

function sub(run,onErr){
  const x={run:()=>run().catch(e=>{if(onErr)onErr(e)})};
  SUBS.push(x);x.run();
  return()=>{const i=SUBS.indexOf(x);if(i>=0)SUBS.splice(i,1)};
}
function remoteDB(){
  const doc=p=>({id:p.split('/').pop(),path:p,
    get:async()=>snapD(p,await fetchDoc(p)),
    set:async d=>writeDoc(p,d,false),
    update:async d=>writeDoc(p,d,true),
    delete:async()=>deleteDoc(p),
    onSnapshot:(n,err)=>sub(async()=>n(snapD(p,await fetchDoc(p))),err)});
  const coll=(c,fl)=>{fl=fl||[];
    const q=async()=>{
      if(c==='bitacora'){
        const r=await srv({accion:'docquery',col:'bitacora',where:[]});
        return r.docs.map(x=>({id:x.id,data:()=>({t:Date.parse(x.data.fecha),fecha:String(x.data.fecha||'').slice(0,10),quien:x.data.usuario,acc:x.data.texto})}));
      }
      const r=await srv({accion:'docquery',col:c,where:fl});
      return r.docs.map(x=>({id:x.id,data:()=>JSON.parse(JSON.stringify(x.data))}));
    };
    const pack=d=>({docs:d,size:d.length,empty:!d.length});
    return{where:(f,o,v)=>coll(c,fl.concat([[f,o,v]])),
      get:async()=>pack(await q()),
      onSnapshot:(n,err)=>sub(async()=>n(pack(await q())),err),
      doc:id=>doc(c+'/'+id),
      add:async d=>{if(c==='bitacora')return;const id='a'+Date.now()+Math.random().toString(36).slice(2,6);await writeDoc(c+'/'+id,d,false);return doc(c+'/'+id)}};
  };
  return{doc,collection:c=>coll(c),dump:()=>({}),load:()=>{}};
}

async function exportar(){
  let dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(!dl)dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
  const [q,l]=await Promise.all([S.db.collection('registros').get(),S.db.collection('bitacora').get()]);
  const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const o=['Fecha;Puesto;Tipo de jean;Inventario;Entrada;Venta;Total;Valor unitario;Valor vendido;Costo;Rentabilidad;Estado;Efectivo recibido'];
  q.docs.map(d=>d.data()).sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(r=>{const p=S.puestos[r.pid]||{};
    S.prods.forEach(x=>{const i=r.inicial[x.id]||0,e=entOf(r,x.id),f=r.cerrado?(r.final||{})[x.id]:'';
      const pr=(r.precios&&r.precios[x.id]!=null)?r.precios[x.id]:x.precio,co=S.costos[x.id]||0,v=(r.cerrado&&f!==''&&f!=null)?i+e-f:'';
      o.push([r.fecha,p.nombre,x.nombre,i,e,v,f,pr,v===''?'':v*pr,v===''?'':v*co,v===''?'':v*(pr-co),r.liquidado?'Liquidado':r.cerrado?'Cerrado':'Abierto',r.liquidado?r.efectivo:''].map(c).join(';'))})});
  o.push('','Gastos','Fecha;Concepto;Monto;Puesto');(S.gas||[]).slice().sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(g=>o.push([g.fecha,g.concepto,g.monto,g.pid&&S.puestos[g.pid]?S.puestos[g.pid].nombre:'General'].map(c).join(';')));
  o.push('','Bitácora','Fecha y hora;Día;Quién;Acción');
  l.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t).forEach(g=>o.push([new Date(g.t).toLocaleString('es-CO'),g.fecha,g.quien,g.acc].map(c).join(';')));
  await dl.save({filename:'respaldo-inventario-'+hoy()+'.csv',data:'\ufeff'+o.join('\n')});await S.db.doc('respaldo/ultimo').set({t:Date.now()});log('Descargó el respaldo');msg('Respaldo guardado. Envíalo a arroyavesantiago80@gmail.com');
}

    await S.db.doc('puestos/'+pid).update({h:await hash(p.usr,c)});log('Cambió la clave de '+p.nombre);msg('Clave actualizada')}
  else if(a==='addprod'){const n=$('#pn').value.trim(),pr=+$('#pp').value;if(!n||!(pr>=0))return msg('Escribe nombre y precio');
    const id='p'+Date.now(),co=+$('#pc').value||0;S.costos[id]=co;await S.db.doc('costos/main').set({c:S.costos});await S.db.doc('config/main').set({prods:[...S.prods,{id,nombre:n,precio:pr}]});log('Creó producto '+n)}
  else if(a==='ejemplo'){const t=Date.now(),L=[['Drill Tinki',60000,50000],['DKD Sencillo',50000,40000],['DKD Básico',55000,45000],['Gimaos',55000,45000],['Crash Sencillo',50000,40000],['Crash Básico',55000,45000],['Clásico',45000,38000],['Bermuda Jean',50000,40000]];S.costos={};
    const ps=L.map((x,i)=>{S.costos['p'+(t+i)]=x[2];return{id:'p'+(t+i),nombre:x[0],precio:x[1]}});await S.db.doc('costos/main').set({c:S.costos});await S.db.doc('config/main').set({prods:ps});msg('Catálogo cargado.')}
  else if(a==='delprod'){if(await yes('¿Quitar este producto? Los registros anteriores se conservan.'))await S.db.doc('config/main').set({prods:S.prods.filter(x=>x.id!==b.dataset.id)})}
  else if(a==='addpuesto'){const n=$('#qn').value.trim(),r=$('#qr').value.trim(),u=$('#qu').value.trim().toLowerCase(),c=$('#qp').value;
    if(!n||!u||c.length<4)return msg('Falta nombre, usuario o clave (mínimo 4 caracteres)');
    if(nomAdmin(u)||Object.values(S.puestos).some(p=>p.usr===u))return msg('Ese usuario ya existe');
    await S.db.doc('puestos/q'+Date.now()).set({nombre:n,resp:r,usr:u,h:await hash(u,c),stock:{}});log('Creó el puesto '+n)}
  else if(a==='delpuesto'){if(await yes('¿Eliminar este puesto?')){log('Eliminó puesto '+S.puestos[pid].nombre);await S.db.doc('puestos/'+pid).delete()}}
  else if(a==='entrega'){const c=parseInt($('#ec').value,10);if(!(c>0))return msg('Cantidad inválida');
    const r=getRec(pid);r.entregas=r.entregas||[];r.entregas.push({p:$('#ep').value,c,h:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})});await saveRec(r);log('Entrega de '+c+' × '+((S.prods.find(z=>z.id===$('#ep').value)||{}).nombre||'?')+' a '+S.puestos[pid].nombre);msg('Inventario agregado')}
  else if(a==='restar'){const c=parseInt($('#ec').value,10);if(!(c>0))return msg('Cantidad inválida');
    const p=$('#ep').value,r=getRec(pid);r.entregas=r.entregas||[];const er=quitarEnt(r,p,c);if(er)return msg(er);
    if(!(await yes('¿Restar '+c+' × '+nomProd(p)+' de las entregas de hoy de '+S.puestos[pid].nombre+'?')))return;
    await saveRec(r);log('Restó '+c+' × '+nomProd(p)+' a '+S.puestos[pid].nombre);msg('Se restaron '+c+' unidades')}
  else if(a==='edent'){const i=+b.dataset.i,r=getRec(pid),y=(r.entregas||[])[i];if(!y)return;
    const v=prompt('Cantidad correcta de '+nomProd(y.p)+' (ahora '+y.c+'). Escribe 0 para eliminar la entrega.',y.c);if(v===null)return;
    const n=parseInt(v,10);if(!(n>=0))return msg('Cantidad inválida');if(n===y.c)return;const ant=y.c;
    if(n===0)r.entregas.splice(i,1);else y.c=n;
    const d=(r.inicial[y.p]||0)+entOf(r,y.p);
    if(r.parcial&&r.parcial[y.p]!=null&&+r.parcial[y.p]>d)return msg('Ese producto ya tiene '+r.parcial[y.p]+' vendidas reportadas; no puede quedar con menos disponible que eso');
    await saveRec(r);log('Corrigió entrega de '+nomProd(y.p)+': '+ant+' → '+n+' en '+S.puestos[pid].nombre);msg('Cantidad corregida')}
  else if(a==='vresp'){S.vResp=!S.vResp;render(true)}
  else if(a==='delent'){const i=+b.dataset.i,r=getRec(pid),y=(r.entregas||[])[i];if(!y)return;
    if(!(await yes('¿Eliminar la entrega de '+y.c+' × '+nomProd(y.p)+' ('+(y.h||'')+')?')))return;
    r.entregas.splice(i,1);const d=(r.inicial[y.p]||0)+entOf(r,y.p);
    if(r.parcial&&r.parcial[y.p]!=null&&+r.parcial[y.p]>d)return msg('Ese producto ya tiene '+r.parcial[y.p]+' vendidas reportadas; no puede quedar con menos disponible que eso');
    await saveRec(r);log('Eliminó entrega de '+y.c+' × '+nomProd(y.p)+' a '+S.puestos[pid].nombre);msg('Entrega eliminada')}
  else if(a==='cerrar'){const r=getRec(pid),fin={};let bad='';
    document.querySelectorAll('[data-ven]').forEach(i=>{if(i.value==='')bad='Escribe las unidades vendidas de todos los productos (0 si no vendiste).';
      const v=parseInt(i.value,10)||0;if(v>+i.dataset.max||v<0)bad='Las vendidas no pueden ser más que las disponibles.';fin[i.dataset.ven]=+i.dataset.max-v});
    if(bad)return msg(bad);
    if(!(await yes('¿Cerrar el día con estos inventarios finales?')))return;
    r.final=fin;r.cerrado=true;r.precios={};S.prods.forEach(x=>r.precios[x.id]=x.precio);
    await saveRec(r);await S.db.doc('puestos/'+pid).update({stock:fin});log('Cerró el día de '+S.puestos[pid].nombre);msg('Día cerrado')}
  else if(a==='avance'){const r=getRec(pid),pa={};let bad='';document.querySelectorAll('[data-ven]').forEach(i=>{const v=parseInt(i.value,10)||0;if(v>+i.dataset.max)bad='Las vendidas no pueden ser más que las disponibles.';pa[i.dataset.ven]=v});
    if(bad)return msg(bad);r.parcial=pa;await saveRec(r);log('Guardó avance de '+S.puestos[pid].nombre);msg('Avance guardado')}
  else if(a==='export'){await exportar()}
  else if(a==='reabrir'){const r=getRec(pid);r.cerrado=false;await saveRec(r);log('Reabrió el día de '+S.puestos[pid].nombre)}
  else if(a==='liquidar'){const ef=parseFloat($('#ef').value);if(!(ef>=0))return msg('Escribe el efectivo recibido');
    const r=getRec(pid);r.efectivo=ef;r.liquidado=true;await saveRec(r);log('Liquidó '+S.puestos[pid].nombre+' con efectivo '+ef);msg('Liquidación guardada')}
  }catch(err){msg('No se pudo guardar: '+(err.message||err))}
});
</script>
