<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tinki Industry Jeans – Inventario</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050505;--card:#121110;--tx:#f4ecd6;--mut:#a99e83;--bd:#3b3322;--ac:#d4af37;--act:#14110a;--ok:#6ee7a0;--bad:#f87171;--wa:#f0b84a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0;color:var(--ac)}
.brand{text-align:center;margin:0 0 8px}.brand img{max-width:92%;object-fit:contain;display:inline-block}
button.p{font-weight:600}h2{font-size:16px;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac)}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
button.d{color:var(--bad)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
input[type=number]{width:84px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}
.big{font-size:26px;font-weight:700}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90%}
a.lk{color:var(--ac);cursor:pointer;text-decoration:underline}
#app.adm{max-width:1240px;display:grid;grid-template-columns:230px 1fr;gap:0 16px;align-items:start}
#app.adm>*{grid-column:2}
#app.adm>.side{grid-column:1;grid-row:1/60;position:sticky;top:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
.side details{margin:2px 0}.side summary{cursor:pointer;padding:8px 10px;font-weight:600;color:var(--ac);list-style:none}
.side summary::before{content:"\25B8  "}.side details[open] summary::before{content:"\25BE  "}
.side button{display:block;width:100%;text-align:left;margin:2px 0;border-color:transparent;background:transparent}
.side button.on{background:var(--ac);color:var(--act);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mut)}.kpi.neg{border-left-color:var(--bad)}.kpi.neg b{color:var(--bad)}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar{height:8px;background:var(--ac);border-radius:4px}
@media(max-width:820px){#app.adm{display:block}#app.adm>.side{position:static;margin-bottom:12px}}
</style>
</head>

const logo=h=>'<img src="'+LOGO+'" alt="Tinki Industry Jeans" style="height:'+(h||64)+'px">';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const INI='2026-11-01',FIN='2026-12-31';
const MODO_PRUEBAS=false;
const S={admin:false,db:null,costos:{},prods:[],puestos:{},regs:{},fecha:(hoy()<INI?INI:hoy()>FIN?FIN:hoy()),sel:null,tab:'inicio',me:null,pin:'',ready:false};
let pend=false,tm;
function msg(t){const m=$('#msg');m.textContent=t;m.hidden=false;clearTimeout(tm);tm=setTimeout(()=>m.hidden=true,4000)}
function render(force){const a=document.activeElement;
  if(!force&&a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)&&$('#app').contains(a)){pend=true;return}
  pend=false;draw()}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;
  if(pend&&!(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)))render()},60));

function subRegs(){if(S.unsub)S.unsub();
  S.unsub=S.db.collection('registros').where('fecha','==',S.fecha).onSnapshot(q=>{S.regs={};q.docs.forEach(d=>S.regs[d.id]=d.data());render()},e=>msg('Error: '+e.message))}

(async()=>{
  try{S.db=remoteDB();S.local=false}catch(e){}
  try{S.ses=JSON.parse(localStorage.getItem('inv_ses')||'null')}catch(e){S.ses=null}
  if(S.ses&&S.ses.u&&S.ses.h){
    try{aplicarSrv(await srv({accion:'bundle'}))}
    catch(e){S.ses=null;try{localStorage.removeItem('inv_ses')}catch(x){};msg(e.message)}
  }
  S.ready=true;render(true);
})();
function aplicarSrv(d){
  if(d.rol!=='admin')throw new Error('Esta entrada es solo para el administrador. Use la entrada de responsables.');
  S.admin=true;S.isAdm=true;S.acc=d.admins||{u:USUARIO_ADMIN,otros:[]};
  cacheFill(d);
  S.enPoder=d.enPoder||{};
  S.fecha=d.hoy;
  iniciarSubs();
}
let _subsOk=false;
function iniciarSubs(){
  if(_subsOk)return;_subsOk=true;
  S.db.doc('config/main').onSnapshot(s=>{S.prods=(s.data()||{}).prods||[];S.alertas=(s.data()||{}).alertas||{};render()});
  S.db.collection('registros').onSnapshot(q=>{S.all=q.docs.map(d=>d.data());render()},()=>{});
  S.db.collection('gastos').onSnapshot(q=>{S.gas=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  S.db.collection('cierres').onSnapshot(q=>{S.cierres={};q.docs.forEach(d=>S.cierres[d.id]=d.data());render()},()=>{});
  S.db.doc('respaldo/ultimo').onSnapshot(s=>{S.resp=s.exists?s.data():null;render()},()=>{});
  S.db.doc('acceso/admin').onSnapshot(s=>{S.acc=s.exists?s.data():null;S.accOk=true;render()},()=>{S.accOk=true;render()});
  S.db.collection('pagos').onSnapshot(q=>{S.pagos=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  S.db.collection('facturas').onSnapshot(q=>{S.facturas=q.docs.map(d=>({id:d.id,data:d.data()}));render()},()=>{});
  S.db.collection('cobros').onSnapshot(q=>{S.cobros=q.docs.map(d=>({id:d.id,data:d.data()}));render()},()=>{});
  S.db.collection('bodega').onSnapshot(q=>{S.bodega=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  S.db.doc('costos/main').onSnapshot(s=>{S.costos=(s.data()||{}).c||{};render()},()=>{});
  S.db.collection('puestos').onSnapshot(q=>{S.puestos={};q.docs.forEach(d=>S.puestos[d.id]=d.data());render()});
  subRegs();
}


function precHtml(pids){
  if(!pids.length||!S.prods.length)return '<p class="mut">Crea puestos y productos para asignar precios.</p>';
  if(!S.ppSel||!S.puestos[S.ppSel])S.ppSel=pids[0];
  const pr=(S.puestos[S.ppSel].precios)||{};
  return `<div class="row" style="margin-bottom:8px"><select id="ppsel">${pids.map(id=>`<option value="${id}" ${id===S.ppSel?'selected':''}>${esc(S.puestos[id].nombre)}</option>`).join('')}</select><span class="mut">Vacío = precio general</span></div>`+
    S.prods.map(x=>`<div class="row" style="margin-bottom:6px"><label class="row" style="flex:1;min-width:140px;gap:6px"><input type="checkbox" data-maneja="${x.id}" ${(!Array.isArray(S.puestos[S.ppSel].productos)||S.puestos[S.ppSel].productos.indexOf(x.id)>=0)?'checked':''}> ${esc(x.nombre)}</label><span class="mut">general ${x.precio}</span><input type="number" min="0" data-pp="${x.id}" value="${pr[x.id]!=null?pr[x.id]:''}" placeholder="${x.precio}" style="width:110px"></div>`).join('')+
    `<div class="row"><button class="p" data-a="savePrecios">Guardar precios de este puesto</button></div>`;
}
function pagosHtml(pids){
  if(!pids.length)return '';
  const sel=(S.pagoSel&&S.puestos[S.pagoSel])?S.pagoSel:pids[0];S.pagoSel=sel;
  const lista=(S.pagos||[]).filter(x=>x.pid===sel).sort((a,b)=>a.fecha<b.fecha?1:-1);
  const c=cuenta(sel),nAbiertos=(S.all||[]).filter(r=>r.pid===sel&&!r.cerrado&&Object.values(r.parcial||{}).some(v=>v>0)).length;
  const estado=c.deb>0?`<span class="wa"><b>Pendiente: le debe ${money(c.deb)}</b></span>`:(c.deb<0?`<span class="ok"><b>Pagado. A favor: ${money(-c.deb)}</b></span>`:'<span class="ok"><b>Pagado al día</b></span>');
  const resumen=`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(S.puestos[sel].nombre)}</b>${estado}</div>
    <div class="row mut" style="margin-top:6px;gap:18px"><span>Vendido (días cerrados): <b>${money(c.venta)}</b></span><span>Pagado: <b>${money(c.efe)}</b></span><span>Arqueo: <b>${money(c.arq)}</b></span></div>
    ${nAbiertos?`<p class="wa" style="margin:8px 0 0">Hay ${nAbiertos} día(s) con ventas sin cerrar. No cuentan en el saldo hasta que se cierren.</p>`:''}
    ${c.deb>0?`<div class="row" style="margin-top:10px"><button class="p" data-a="pagoTotal">Marcar pagado (saldo completo: ${money(c.deb)})</button></div>`:''}</div>`;
  return `<h2 style="margin-top:14px">Estado de cuenta y pagos</h2>${resumen}<div class="card"><div class="row" style="margin-bottom:8px"><select id="pgsel">${pids.map(id=>`<option value="${id}" ${id===sel?'selected':''}>${esc(S.puestos[id].nombre)}</option>`).join('')}</select></div>

function informeHtml(){
  const f=S.fecha, gen=new Date().toLocaleString('es-CO');

  const porPuesto=[], porProd={}, clientesPend=[];
  let V=0,C=0,U=0,UN=0,calleU=0,calleV=0,calleC=0,cobrarPuestos=0,efectivo=0,abiertos=0;
  pu.forEach(pid=>{
    const p=S.puestos[pid], cf=(p.corte&&p.corte.fecha)||'';
    const recs=(S.all||[]).filter(r=>r.pid===pid&&r.cerrado&&r.fecha>=cf);
    let pv=0,pc=0,pu_=0;
    recs.forEach(r=>{S.prods.forEach(x=>{
      const i=(r.inicial&&r.inicial[x.id])||0,e=entOf(r,x.id),fin=(r.final||{})[x.id];
      const sold=fin!=null?i+e-fin:((r.parcial&&r.parcial[x.id])||0);
      if(!sold)return;
      const pr=(r.precios&&r.precios[x.id]!=null)?r.precios[x.id]:pprice(pid,x);
      pv+=sold*pr;pc+=sold*costo(x);pu_+=sold;
      const k=x.id;porProd[k]=porProd[k]||{nombre:x.nombre,u:0,v:0,c:0};
      porProd[k].u+=sold;porProd[k].v+=sold*pr;porProd[k].c+=sold*costo(x);
    });});
    const cu=cuenta(pid);
    const ep=(S.enPoder||{})[pid]||{};
    let eu=0,ev=0,ec=0;
    S.prods.forEach(x=>{const n=ep[x.id]||0;eu+=n;ev+=n*pprice(pid,x);ec+=n*costo(x)});
    abiertos+=(S.all||[]).filter(r=>r.pid===pid&&!r.cerrado&&r.fecha<f&&r.fecha>=cf&&Object.values(r.parcial||{}).some(v=>v>0)).length;
    V+=pv;C+=pc;U+=pv-pc;UN+=pu_;calleU+=eu;calleV+=ev;calleC+=ec;
    cobrarPuestos+=Math.max(0,cu.deb);efectivo+=cu.efe;
    porPuesto.push({nombre:p.nombre,resp:p.resp||'',vendidas:pu_,venta:pv,costo:pc,util:pv-pc,margen:pv?(pv-pc)/pv*100:0,enCalleU:eu,enCalleV:ev,saldo:cu.deb,pagado:cu.efe});
  });
  const gastos=(S.gas||[]).reduce((t,g)=>t+(+g.monto||0),0);

  });

  const bodegaU=Object.values(stockBodega()).reduce((t,n)=>t+n,0);
  const prodRows=Object.values(porProd).sort((a,b)=>b.v-a.v).map(x=>`<tr><td>${esc(x.nombre)}</td><td class="n">${x.u}</td><td class="n">${money(x.v)}</td><td class="n">${money(x.c)}</td><td class="n">${money(x.v-x.c)}</td><td class="n">${x.v?((x.v-x.c)/x.v*100).toFixed(1):'0.0'}%</td></tr>`).join('')||'<tr><td colspan="6">Sin ventas cerradas todavía.</td></tr>';
  const puRows=porPuesto.map(x=>`<tr><td><b>${esc(x.nombre)}</b><div class="m">${esc(x.resp)}</div></td><td class="n">${x.vendidas}</td><td class="n">${money(x.venta)}</td><td class="n">${money(x.costo)}</td><td class="n">${money(x.util)}</td><td class="n">${x.margen.toFixed(1)}%</td><td class="n">${x.enCalleU} u · ${money(x.enCalleV)}</td><td class="n">${money(x.pagado)}</td><td class="n ${x.saldo>0?'neg':''}">${money(x.saldo)}</td></tr>`).join('');
  const cliRows=clientesPend.map(x=>`<tr><td>${esc(x.cliente)}</td><td>${esc(x.fecha)}</td><td class="n">${money(x.total)}</td><td class="n neg">${money(x.saldo)}</td></tr>`).join('')||'<tr><td colspan="4">Sin saldos pendientes.</td></tr>';
  const alertas=[];
  if(cobrarPuestos>0)alertas.push(`Los puestos deben ${money(cobrarPuestos)} en total.`);
  if(porCobrarCli>0)alertas.push(`Los clientes deben ${money(porCobrarCli)} en ${clientesPend.length} factura(s).`);

  const resumen=`En el período, el negocio vendió ${UN} unidades por ${money(V)}, con un costo de ${money(C)}. La utilidad bruta es de ${money(U)} (margen ${margenGral.toFixed(1)}%). Tras ${money(gastos)} de gastos, la utilidad neta es de ${money(neta)}. Hay ${calleU} unidades en la calle, valoradas en ${money(calleV)} a precio de distribución.`;

  table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #e5e5e5;padding:6px 6px;text-align:left;vertical-align:top}
  th{background:#f2f2f2;font-size:11px;text-transform:uppercase;color:#444}td.n,th.n{text-align:right;white-space:nowrap}
  .neg{color:#b00020;font-weight:bold}.m{color:#777;font-size:11px}
  .alert{font-size:13px;margin:4px 0}.alert:before{content:'• '}

  </style></head><body>

function ventaRec(r){let v=0;S.prods.forEach(x=>{v+=((r.inicial[x.id]||0)+entOf(r,x.id)-((r.final||{})[x.id]||0))*((r.precios&&r.precios[x.id]!=null)?r.precios[x.id]:x.precio)});return v}
function svgDias(R){if(!R.length)return'<p class="mut">Sin ventas cerradas en el periodo.</p>';
  const W=720,H=200,m=30,n=R.length,mx=Math.max(...R.map(r=>r.v),1),mc=Math.max(...R.map(r=>r.cum),1),bw=(W-2*m)/n;

  const pts=R.map((r,i)=>`${m+i*bw+bw/2},${H-m-(r.cum/mc)*(H-2*m)}`).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="${m}" y1="${H-m}" x2="${W-m}" y2="${H-m}" stroke="var(--bd)"/>${bars}<polyline points="${pts}" fill="none" stroke="var(--ok)" stroke-width="2"/></svg><p class="mut" style="margin:0;font-size:12px">Barras: venta del día · Línea: acumulado (máximo ${money(mc)})</p>`}

    const pr=(r.precios&&r.precios[x.id]!=null)?r.precios[x.id]:x.precio,d=D[r.fecha]=D[r.fecha]||{u:0,v:0,c:0,g:0},p=P[x.id]=P[x.id]||{u:0,v:0};d.u+=s;d.v+=s*pr;d.c+=s*(S.costos[x.id]||0);p.u+=s;p.v+=s*pr;u+=s});arq+=arqVal(r)});

function descuadres(){const L=[],by={},hs=hoy();(S.all||[]).forEach(r=>{(by[r.pid]=by[r.pid]||[]).push(r)});

    else if(r.fecha<hs)L.push([r.fecha,nm,'Sin cerrar','El responsable no cerró el día',0]);

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function bajar(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
async function exportMes(){const mes=S.mm||S.fecha.slice(0,7),pl={formato:'tinki-inventario',version:2,mes,generado:new Date().toISOString(),base:{prods:S.prods,costos:S.costos,puestos:S.puestos},registros:(S.all||[]).filter(r=>r.fecha.slice(0,7)===mes),gastos:(S.gas||[]).filter(g=>g.fecha.slice(0,7)===mes)};

  const hh=await sha(JSON.stringify(pl));bajar('inventario-'+mes+'.json',JSON.stringify(Object.assign({},pl,{hash:hh}),null,1),'application/json');return hh}
async function importMes(file){let o;try{o=JSON.parse(await file.text())}catch(e){return msg('El archivo no es un JSON válido')}
  if(o.formato!=='tinki-inventario')return msg('Archivo no reconocido');const h=o.hash;delete o.hash;const ok=(await sha(JSON.stringify(o)))===h;
  if(!(await yes((ok?'Huella correcta. ':'ATENCIÓN: la huella NO coincide, el archivo fue modificado. ')+'Se importarán '+o.registros.length+' registros de '+o.mes+'. ¿Continuar?')))return;
  if(!S.prods.length&&o.base){await S.db.doc('config/main').set({prods:o.base.prods});await S.db.doc('costos/main').set({c:o.base.costos||{}});for(const id of Object.keys(o.base.puestos||{}))await S.db.doc('puestos/'+id).set(o.base.puestos[id])}
  for(const r of o.registros)await S.db.doc('registros/'+r.pid+'_'+r.fecha).set(r);
  for(const g of o.gastos){const d=Object.assign({},g);const id=d.id||('g'+Date.now()+Math.random().toString(36).slice(2,5));delete d.id;await S.db.doc('gastos/'+id).set(d)}
  log('Importó el mes '+o.mes+' ('+o.registros.length+' registros)');msg('Importación lista')}

const arqVal=r=>{let v=0;if(r.arqueo)S.prods.forEach(x=>{const c=r.arqueo[x.id];if(c!=null){const pr=(r.precios&&r.precios[x.id]!=null)?r.precios[x.id]:x.precio;v+=(c-((r.final||{})[x.id]||0))*pr}});return v};

function cuenta(pid,recs){const p=S.puestos[pid]||{},oe={},cf=(p.corte&&p.corte.fecha)||'';let venta=0,efe=0,arq=0;
  (recs||S.all||[]).filter(r=>r.pid===pid&&r.fecha>=cf).forEach(r=>{
    if(r.cerrado){S.prods.forEach(x=>{const s=(r.inicial[x.id]||0)+entOf(r,x.id)-((r.final||{})[x.id]||0),pr=(r.precios&&r.precios[x.id]!=null)?r.precios[x.id]:x.precio;venta+=s*pr});arq+=arqVal(r)}
    else S.prods.forEach(x=>{oe[x.id]=(oe[x.id]||0)+entOf(r,x.id)})});
  (S.pagos||[]).forEach(x=>{if(x.pid===pid&&(x.fecha||'')>=cf)efe+=+x.monto||0});
  let st=0,val=0;const ep=(S.enPoder||{})[pid];
  S.prods.forEach(x=>{const n=ep?(ep[x.id]||0):((p.stock||{})[x.id]||0)+(oe[x.id]||0);st+=n;val+=n*pprice(pid,x)});
  return{st,val,venta,efe,arq,deb:venta-efe-arq}}

  const [q,l]=await Promise.all([S.db.collection('registros').get(),S.db.collection('bitacora').get()]);
  const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const o=['Fecha;Puesto;Tipo de jean;Inventario;Entrada;Venta;Total;Valor unitario;Valor vendido;Costo;Rentabilidad;Estado;Efectivo recibido'];

    S.prods.forEach(x=>{const i=r.inicial[x.id]||0,e=entOf(r,x.id),f=r.cerrado?(r.final||{})[x.id]:'';
      const pr=(r.precios&&r.precios[x.id]!=null)?r.precios[x.id]:x.precio,co=S.costos[x.id]||0,v=(r.cerrado&&f!==''&&f!=null)?i+e-f:'';
      o.push([r.fecha,p.nombre,x.nombre,i,e,v,f,pr,v===''?'':v*pr,v===''?'':v*co,v===''?'':v*(pr-co),r.liquidado?'Liquidado':r.cerrado?'Cerrado':'Abierto',r.liquidado?r.efectivo:''].map(c).join(';'))})});
  o.push('','Gastos','Fecha;Concepto;Monto;Puesto');(S.gas||[]).slice().sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(g=>o.push([g.fecha,g.concepto,g.monto,g.pid&&S.puestos[g.pid]?S.puestos[g.pid].nombre:'General'].map(c).join(';')));

}

    if(!tot)return msg('Escribe al menos una línea');
    const nn=Object.values(nue);
    if(nn.length){if(!(await yes('Estos productos no existen: '+nn.map(x=>x.nombre).join(', ')+'. ¿Crearlos con costo y precio en 0? Después completas los precios en Configuración.')))return;
      const t=Date.now();nn.forEach((x,i)=>{x.id='p'+(t+i);its[x.id]=x.c});
      const cs=Object.assign({},S.costos);nn.forEach(x=>{cs[x.id]=0});S.costos=cs;
      await S.db.doc('costos/main').set({c:cs});await S.db.doc('config/main').set({prods:S.prods.concat(nn.map(x=>({id:x.id,nombre:x.nombre,precio:0})))})}
    const r=getRec(pid);r.entregas=r.entregas||[];const hh=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    Object.keys(its).forEach(id=>r.entregas.push({p:id,c:its[id],h:hh}));
    await saveRec(r);log('Entrada por lista: '+tot+' unidades a '+S.puestos[pid].nombre);msg('Entrada cargada: '+tot+' unidades')}
  else if(a==='informe'){const f=(prompt('Formato del informe: escriba PDF o CSV','PDF')||'').trim().toUpperCase();if(f==='PDF')informePdf();else if(f==='CSV')await informeDia();else msg('Escriba PDF o CSV')}
  else if(a==='copiar'){await copiar(resumenTxt(pid))}
  else if(a==='reset'){if(!(await yes('¿Borrar TODOS los registros, gastos y la bitácora? Los productos y los puestos se conservan y el inventario de cada puesto queda en 0.')))return;
    for(const r of (S.all||[]))await S.db.doc('registros/'+r.pid+'_'+r.fecha).delete();
    for(const g of (S.gas||[]))await S.db.doc('gastos/'+g.id).delete();
    const bt=await S.db.collection('bitacora').get();for(const d of bt.docs)await S.db.doc('bitacora/'+d.id).delete();
    for(const id of Object.keys(S.puestos))await S.db.doc('puestos/'+id).update({stock:{}});
    try{await S.db.doc('respaldo/ultimo').delete()}catch(x){}msg('Datos de prueba borrados')}
  else if(a==='arqueo'){const r=getRec(pid),ar={};let bad=false;document.querySelectorAll('[data-aq]').forEach(i=>{if(i.value==='')bad=true;ar[i.dataset.aq]=parseInt(i.value,10)||0});
    if(bad)return msg('Escribe el conteo de todos los productos (0 si no hay).');
    r.arqueo=ar;await saveRec(r);
    if(!(S.all||[]).some(x=>x.pid===pid&&x.fecha>r.fecha))await S.db.doc('puestos/'+pid).update({stock:ar});
    log('Hizo arqueo en '+S.puestos[pid].nombre);msg('Arqueo guardado')}
  else if(a==='addgasto'){const c=$('#gc').value.trim(),m=parseFloat($('#gm').value);if(!c||!(m>0))return msg('Escribe el concepto y el monto');
    await S.db.collection('gastos').add({fecha:S.fecha,concepto:c,monto:m,pid:$('#gp').value||''});log('Registró gasto: '+c+' '+m);msg('Gasto agregado')}
  else if(a==='delgasto'){if(await yes('¿Quitar este gasto?'))await S.db.doc('gastos/'+b.dataset.id).delete()}
  else if(a==='bitact'){await cargarBit()}
  else if(a==='abrirdatos'){await datosJSON(false)}
  else if(a==='creardatos'){await datosJSON(true)}
  else if(a==='limpiar'){S.fy=S.fm=S.fp=S.fq='';render(true)}
  else if(a==='expmes'){await exportMes();msg('Archivo del mes descargado')}
  else if(a==='impmes'){$('#imf').click()}
  else if(a==='cerrarmes'){await cerrarMes()}
  else if(a==='abrirmes'){const mes=S.mm||S.fecha.slice(0,7);if(await yes('\u00bfReabrir el mes '+mes+'?')){await S.db.doc('cierres/'+mes).delete();log('Reabri\u00f3 el mes '+mes)}}
  else if(a==='claveadm'){const u=b.dataset.u,c=$('#nca_'+b.dataset.i).value;if(c.length<4)return msg('La clave debe tener mínimo 4 caracteres');
    const h=await hash(u,c),acc=JSON.parse(JSON.stringify(S.acc));if(acc.u===u)acc.h=h;else(acc.otros||[]).forEach(x=>{if(x.u===u)x.h=h});
    await S.db.doc('acceso/admin').set(acc);if(u===S.ses.u){S.ses={u,h};try{localStorage.setItem('inv_ses',JSON.stringify(S.ses))}catch(x){}}log('Cambió la clave del administrador '+u);msg('Clave actualizada')}
  else if(a==='deladm'){const u=b.dataset.u;if(u===S.ses.u||u===S.acc.u)return msg('No se puede quitar este administrador');if(!(await yes('¿Quitar al administrador '+u+'?')))return;
    const acc=JSON.parse(JSON.stringify(S.acc));acc.otros=(acc.otros||[]).filter(x=>x.u!==u);await S.db.doc('acceso/admin').set(acc);log('Quitó al administrador '+u)}
  else if(a==='addadm'){const u=$('#nu').value.trim().toLowerCase(),c=$('#np2').value;if(!u||c.length<4)return msg('Escribe usuario y clave de mínimo 4 caracteres');
    if(nomAdmin(u)||Object.values(S.puestos).some(p=>p.usr===u))return msg('Ese usuario ya existe');
    const acc=JSON.parse(JSON.stringify(S.acc));acc.otros=(acc.otros||[]).concat([{u,h:await hash(u,c)}]);await S.db.doc('acceso/admin').set(acc);log('Agregó al administrador '+u);msg('Administrador agregado')}
  else if(a==='cambiaradm'){const c=$('#ac').value;if(c.length<4)return msg('La clave debe tener mínimo 4 caracteres');
    const u=S.ses.u,h=await hash(u,c),acc=JSON.parse(JSON.stringify(S.acc));if(acc.u===u)acc.h=h;else(acc.otros||[]).forEach(x=>{if(x.u===u)x.h=h});await S.db.doc('acceso/admin').set(acc);S.ses={u,h};try{localStorage.setItem('inv_ses',JSON.stringify(S.ses))}catch(x){}msg('Clave actualizada')}
  else if(a==='regPago'){const pid=S.pagoSel,m=parseFloat($('#pgm').value),f=$('#pgf').value||hoy(),n=($('#pgn').value||'').trim();if(!(m>0))return msg('Escribe el monto recibido');await S.db.collection('pagos').add({pid,fecha:f,monto:m,nota:n});log('Registró pago de '+money(m)+' de '+S.puestos[pid].nombre);msg('Pago registrado')}
  else if(a==='delPago'){if(!(await yes('¿Quitar este pago?')))return;await S.db.collection('pagos').doc(b.dataset.id).delete();log('Quitó un pago');msg('Pago quitado')}
  else if(a==='pagoTotal'){const pid=S.pagoSel,c=cuenta(pid);if(!(c.deb>0))return msg('No hay saldo pendiente');if(!(await yes('¿Registrar pago de '+money(c.deb)+' como saldo completo?')))return;await S.db.collection('pagos').add({pid,fecha:hoy(),monto:Math.round(c.deb),nota:'Saldo completo'});log('Registró pago de saldo completo de '+money(c.deb)+' de '+S.puestos[pid].nombre);msg('Saldo marcado como pagado')}
  else if(a==='iniciarCero'){const f=$('#cfe').value||hoy(),ini={};document.querySelectorAll('[data-cor]').forEach(i=>{const v=parseInt(i.value,10);if(v>0)ini[i.dataset.cor]=v});if(!(await yes('¿Empezar de cero con '+f+' para '+S.puestos[pid].nombre+'? Lo anterior deja de afectar los saldos.')))return;await S.db.doc('puestos/'+pid).update({corte:{fecha:f,inicial:ini},stock:ini});log('Empezó de cero '+S.puestos[pid].nombre+' desde '+f);msg('Inicio de operación guardado')}
  else if(a==='saveAlertas'){const s=parseFloat($('#alS').value),d=parseInt($('#alD').value,10);if(!(s>=0)||!(d>=0))return msg('Escribe valores válidos');await S.db.doc('config/main').update({alertas:{saldo:s,dias:d}});log('Cambió los límites de alertas');msg('Alertas guardadas')}
  else if(a==='regBodega'){const tipo=$('#bt').value,pr=$('#bp').value,c=parseInt($('#bc').value,10),f=$('#bf').value||hoy(),pu=$('#bpu').value,n=($('#bn').value||'').trim();if(!(c>0))return msg('Escribe la cantidad');const prod=S.prods.find(x=>x.id===pr)||{};await S.db.collection('bodega').add({tipo,fecha:f,producto:pr,producto_nombre:prod.nombre||'',cantidad:c,pid:pu,puesto_nombre:pu&&S.puestos[pu]?S.puestos[pu].nombre:'',nota:n});msg(tipo==='salida'?'Traslado registrado':'Entrada registrada')}
  else if(a==='informePdf'){informePdf();return}
  else if(a==='addFactRow'){S.factLines=(S.factLines||[]).concat([{p:'',c:1,pr:''}]);render(true)}
  else if(a==='delFactRow'){S.factLines=(S.factLines||[]);S.factLines.splice(+b.dataset.i,1);if(!S.factLines.length)S.factLines=[{p:'',c:1,pr:''}];render(true)}
  else if(a==='crearFactura'){const cli=($('#fcli').value||'').trim(),fe=$('#ffec').value||hoy();if(!cli)return msg('Escribe el nombre del cliente');const items=(S.factLines||[]).filter(l=>l.p).map(l=>{const x=S.prods.find(z=>z.id===l.p);return{p:l.p,nombre:x?x.nombre:'',c:+l.c||0,pr:+l.pr||0}});if(!items.length)return msg('Elija al menos un producto');if(items.some(x=>!(x.c>0)))return msg('La cantidad debe ser mayor a cero');if(items.some(x=>x.pr<0))return msg('El precio no puede ser negativo');const total=items.reduce((t,x)=>t+x.c*x.pr,0);const id='f'+Date.now();await S.db.collection('facturas').doc(id).set({cliente:cli,fecha:fe,items,total});for(const x of items){await S.db.collection('bodega').add({tipo:'salida',fecha:fe,producto:x.p,producto_nombre:x.nombre,cantidad:x.c,pid:'',puesto_nombre:'',nota:'Factura de '+cli})}S.factLines=null;S.factCli='';msg('Factura creada: '+money(total))}
  else if(a==='cobrar'){const id=b.dataset.id,m=parseFloat($('#cob_'+id).value);const f=(S.facturas||[]).find(x=>x.id===id);if(!f)return;const pag=(S.cobros||[]).filter(c=>c.data.factura===id).reduce((t,c)=>t+(+c.data.monto||0),0);const sal=(+f.data.total||0)-pag;if(!(m>0)||m>sal)return msg('Escribe un monto válido, máximo '+money(sal));await S.db.collection('cobros').add({factura:id,cliente:f.data.cliente,fecha:hoy(),monto:m});msg('Cobro registrado')}
  else if(a==='devolver'){const c=parseInt($('#ec').value,10),p=$('#ep').value;if(!(c>0))return msg('Cantidad inválida');const r=getRec(pid);const disp=((r.inicial&&r.inicial[p])||0)+entOf(r,p);if(c>disp)return msg('Solo puede devolver hasta '+disp+' unidades disponibles');if(!(await yes('¿Devolver '+c+' × '+nomProd(p)+' de '+S.puestos[pid].nombre+' a bodega?')))return;r.entregas=(r.entregas||[]).concat([{p,c:-c,h:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),dev:true}]);await saveRec(r);await S.db.collection('bodega').add({tipo:'entrada',fecha:S.fecha,producto:p,producto_nombre:nomProd(p),cantidad:c,pid:pid,puesto_nombre:S.puestos[pid].nombre,nota:'Devolución de '+S.puestos[pid].nombre});log('Devolvió a bodega '+c+' × '+nomProd(p)+' de '+S.puestos[pid].nombre);msg('Devuelto a bodega')}
  else if(a==='savePrecios'){const pr={};document.querySelectorAll('[data-pp]').forEach(i=>{if(i.value!=='')pr[i.dataset.pp]=+i.value});const maneja=[...document.querySelectorAll('[data-maneja]')].filter(i=>i.checked).map(i=>i.dataset.maneja);await S.db.doc('puestos/'+S.ppSel).update({precios:pr,productos:maneja});log('Productos y precios del puesto '+S.puestos[S.ppSel].nombre);msg('Guardado')}
  else if(a==='clave'){const c=$('#nc_'+pid).value,p=S.puestos[pid];if(c.length<4||!p.usr)return msg('Clave de mínimo 4 caracteres (y el puesto debe tener usuario)');
    await S.db.doc('puestos/'+pid).update({h:await hash(p.usr,c)});log('Cambió la clave de '+p.nombre);msg('Clave actualizada')}
  else if(a==='addprod'){const n=$('#pn').value.trim(),pr=+$('#pp').value;if(!n||!(pr>=0))return msg('Escribe nombre y precio');
    const id='p'+Date.now(),co=+$('#pc').value||0;S.costos[id]=co;await S.db.doc('costos/main').set({c:S.costos});await S.db.doc('config/main').set({prods:[...S.prods,{id,nombre:n,precio:pr}]});log('Creó producto '+n)}
  else if(a==='ejemplo'){const t=Date.now(),L=[['Drill Tinki',60000,50000],['DKD Sencillo',50000,40000],['DKD Básico',55000,45000],['Gimaos',55000,45000],['Crash Sencillo',50000,40000],['Crash Básico',55000,45000],['Clásico',45000,38000],['Bermuda Jean',50000,40000]];S.costos={};
    const ps=L.map((x,i)=>{S.costos['p'+(t+i)]=x[2];return{id:'p'+(t+i),nombre:x[0],precio:x[1]}});await S.db.doc('costos/main').set({c:S.costos});await S.db.doc('config/main').set({prods:ps});msg('Catálogo cargado.')}
  else if(a==='delprod'){if(await yes('¿Quitar este producto? Los registros anteriores se conservan.'))await S.db.doc('config/main').set({prods:S.prods.filter(x=>x.id!==b.dataset.id)})}
  else if(a==='addpuesto'){const n=$('#qn').value.trim(),r=$('#qr').value.trim(),u=$('#qu').value.trim().toLowerCase(),c=$('#qp').value;
    if(!n||!u||c.length<4)return msg('Falta nombre, usuario o clave (mínimo 4 caracteres)');
    if(nomAdmin(u)||Object.values(S.puestos).some(p=>p.usr===u))return msg('Ese usuario ya existe');
    await S.db.doc('puestos/q'+Date.now()).set({nombre:n,resp:r,usr:u,h:await hash(u,c),stock:{}});log('Creó el puesto '+n)}
  else if(a==='delpuesto'){if(await yes('¿Eliminar este puesto?')){log('Eliminó puesto '+S.puestos[pid].nombre);await S.db.doc('puestos/'+pid).delete()}}
  else if(a==='entrega'){const c=parseInt($('#ec').value,10);if(!(c>0))return msg('Cantidad inválida');
    const r=getRec(pid);r.entregas=r.entregas||[];r.entregas.push({p:$('#ep').value,c,h:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})});await saveRec(r);log('Entrega de '+c+' × '+((S.prods.find(z=>z.id===$('#ep').value)||{}).nombre||'?')+' a '+S.puestos[pid].nombre);msg('Inventario agregado')}
  else if(a==='restar'){const c=parseInt($('#ec').value,10);if(!(c>0))return msg('Cantidad inválida');
    const p=$('#ep').value,r=getRec(pid);r.entregas=r.entregas||[];const er=quitarEnt(r,p,c);if(er)return msg(er);
    if(!(await yes('¿Restar '+c+' × '+nomProd(p)+' de las entregas de hoy de '+S.puestos[pid].nombre+'?')))return;
    await saveRec(r);log('Restó '+c+' × '+nomProd(p)+' a '+S.puestos[pid].nombre);msg('Se restaron '+c+' unidades')}
  else if(a==='edent'){const i=+b.dataset.i,r=getRec(pid),y=(r.entregas||[])[i];if(!y)return;
    const v=prompt('Cantidad correcta de '+nomProd(y.p)+' (ahora '+y.c+'). Escribe 0 para eliminar la entrega.',y.c);if(v===null)return;
    const n=parseInt(v,10);if(!(n>=0))return msg('Cantidad inválida');if(n===y.c)return;const ant=y.c;
    if(n===0)r.entregas.splice(i,1);else y.c=n;
    const d=(r.inicial[y.p]||0)+entOf(r,y.p);
    if(r.parcial&&r.parcial[y.p]!=null&&+r.parcial[y.p]>d)return msg('Ese producto ya tiene '+r.parcial[y.p]+' vendidas reportadas; no puede quedar con menos disponible que eso');
    await saveRec(r);log('Corrigió entrega de '+nomProd(y.p)+': '+ant+' → '+n+' en '+S.puestos[pid].nombre);msg('Cantidad corregida')}
  else if(a==='vresp'){S.vResp=!S.vResp;render(true)}
  else if(a==='delent'){const i=+b.dataset.i,r=getRec(pid),y=(r.entregas||[])[i];if(!y)return;
    if(!(await yes('¿Eliminar la entrega de '+y.c+' × '+nomProd(y.p)+' ('+(y.h||'')+')?')))return;
    r.entregas.splice(i,1);const d=(r.inicial[y.p]||0)+entOf(r,y.p);
    if(r.parcial&&r.parcial[y.p]!=null&&+r.parcial[y.p]>d)return msg('Ese producto ya tiene '+r.parcial[y.p]+' vendidas reportadas; no puede quedar con menos disponible que eso');
    await saveRec(r);log('Eliminó entrega de '+y.c+' × '+nomProd(y.p)+' a '+S.puestos[pid].nombre);msg('Entrega eliminada')}
  else if(a==='cerrar'){const r=getRec(pid),fin={};let bad='';
    document.querySelectorAll('[data-ven]').forEach(i=>{if(i.value==='')bad='Escribe las unidades vendidas de todos los productos (0 si no vendiste).';
      const v=parseInt(i.value,10)||0;if(v>+i.dataset.max||v<0)bad='Las vendidas no pueden ser más que las disponibles.';fin[i.dataset.ven]=+i.dataset.max-v});
    if(bad)return msg(bad);
    if(!(await yes('¿Cerrar el día con estos inventarios finales?')))return;
    r.final=fin;r.cerrado=true;r.precios={};S.prods.forEach(x=>r.precios[x.id]=pprice(pid,x));
    await saveRec(r);await S.db.doc('puestos/'+pid).update({stock:fin});log('Cerró el día de '+S.puestos[pid].nombre);msg('Día cerrado')}
  else if(a==='avance'){const r=getRec(pid),pa={};let bad='';document.querySelectorAll('[data-ven]').forEach(i=>{const v=parseInt(i.value,10)||0;if(v>+i.dataset.max)bad='Las vendidas no pueden ser más que las disponibles.';pa[i.dataset.ven]=v});
    if(bad)return msg(bad);r.parcial=pa;await saveRec(r);log('Guardó avance de '+S.puestos[pid].nombre);msg('Avance guardado')}
  else if(a==='export'){const f=(prompt('Formato del respaldo: escriba PDF o CSV','PDF')||'').trim().toUpperCase();if(f==='PDF')informePdf();else if(f==='CSV')await exportar();else msg('Escriba PDF o CSV')}
  else if(a==='reabrir'){const r=getRec(pid);r.cerrado=false;await saveRec(r);log('Reabrió el día de '+S.puestos[pid].nombre)}
  else if(a==='liquidar'){const ef=parseFloat($('#ef').value);if(!(ef>=0))return msg('Escribe el efectivo recibido');
    const r=getRec(pid);r.efectivo=ef;r.liquidado=true;await saveRec(r);if(ef>0)await S.db.collection('pagos').add({pid,fecha:S.fecha,monto:ef,nota:'Liquidación del día '+S.fecha});log('Liquidó '+S.puestos[pid].nombre+' con efectivo '+ef);msg('Liquidación guardada')}
  }catch(err){msg('No se pudo guardar: '+(err.message||err))}
});
</script>
